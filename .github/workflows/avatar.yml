name: Sync Profile Avatar

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/avatar.yml
      - scripts/sync_profile_avatar.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh embedded GitHub avatar
        run: python3 scripts/sync_profile_avatar.py assets/hero-profile-v8.svg "$GITHUB_REPOSITORY_OWNER"
      - name: Commit only if the avatar changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/hero-profile-v8.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync profile avatar'
            git pull --rebase origin main
            git push
          fi
