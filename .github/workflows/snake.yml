name: Generate Contribution Snake

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/style_contribution_snake.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake-v3.svg?color_snake=#facc15&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
      - name: Animate snake color and eaten cells
        run: python3 scripts/style_contribution_snake.py assets/contribution-snake-v3.svg
      - name: Commit updated animation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contribution-snake-v3.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution snake'
            git pull --rebase origin main
            git push
          fi
