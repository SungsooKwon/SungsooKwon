name: Generate Contribution Snake

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#6185c5&color_dots=#f3f5f8,#dce8f5,#bdd1ea,#8fb0dc,#5d88c1
      - name: Commit updated animation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution snake'
            git push
          fi
