name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Apply Pretendard to generated SVGs
        run: |
          sed -i 's/font-family: "Ubuntu", "Helvetica", "Arial", sans-serif;/font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", "Helvetica", "Arial", sans-serif;/g' profile-3d-contrib/*.svg
      - name: Commit & push updated graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile contribution graph'
            git push
          fi
