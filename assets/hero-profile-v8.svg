<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Sungsoo Kwon — Data Scientist and AI Engineer</title>
  <desc id="desc">An editorial profile panel with Sungsoo's current GitHub profile photo and a three-step AI work process: data analysis, AI modeling, and on-site validation and adaptation.</desc>
  <rect x="1" y="1" width="998" height="418" rx="8" fill="#f8f9fb" stroke="#d0d7de" stroke-width="2"/>
  <line x1="54" y1="46" x2="943" y2="46" stroke="#d0d7de" stroke-width="1"/>

  <defs>
    <clipPath id="avatar-clip"><rect x="74" y="103" width="223" height="223" rx="4"/></clipPath>
  </defs>
  <rect x="54" y="75" width="263" height="273" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="74" y="103" width="223" height="223" rx="4" fill="#f1f3f5"/>
  <image id="github-avatar" x="74" y="103" width="223" height="223" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" href="data:image/jpeg;base64,"/>

  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Arial, sans-serif">
    <g>
      <text x="355" y="118" fill="#626b76" font-size="17" font-weight="500" letter-spacing=".2">Data Scientist · AI Engineer</text>
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur=".7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 0" begin="0s" dur=".7s" fill="freeze"/>
    </g>
    <g>
      <text x="352" y="185" fill="#17191f" font-size="54" font-weight="650" letter-spacing="-1.8">Sungsoo Kwon</text>
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 0" begin="0s" dur="1s" fill="freeze"/>
    </g>
    <g>
      <text x="355" y="226" fill="#5e636d" font-size="22">AI for industrial operations</text>
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="1.2s" fill="freeze"/>
    </g>
  </g>
  <rect x="354" y="248" width="171" height="39" rx="6" fill="#eef4fb"/>
  <circle cx="375" cy="267.5" r="5" fill="#007aff"/>
  <text x="391" y="274" fill="#2363a8" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600">MongooseAI</text>
  <line x1="355" y1="314" x2="943" y2="314" stroke="#dce0e5"/>

  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600">
    <text x="355" y="365" fill="#4e5661" opacity="0">Data analysis
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.82;.9;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <path d="M466 358 H508" fill="none" stroke="#7f9dc2" stroke-width="2" stroke-linecap="round" stroke-dasharray="42" stroke-dashoffset="42" opacity="0">
      <animate attributeName="stroke-dashoffset" values="42;42;0;0;0" keyTimes="0;.12;.27;.84;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.12;.8;.9;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <text x="526" y="365" fill="#4e5661" opacity="0">AI modeling
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.36;.82;.9;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <path d="M633 358 H695" fill="none" stroke="#7f9dc2" stroke-width="2" stroke-linecap="round" stroke-dasharray="62" stroke-dashoffset="62" opacity="0">
      <animate attributeName="stroke-dashoffset" values="62;62;0;0;0" keyTimes="0;.4;.56;.84;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.4;.48;.8;.9;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <text x="713" y="365" fill="#4e5661" opacity="0">On-site validation &amp; adaptation
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.57;.65;.82;.9;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
