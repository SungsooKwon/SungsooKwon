<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Sungsoo Kwon — Data Scientist at MongooseAI</title>
  <desc id="desc">Animated profile banner with a pixel portrait, data graph, and skills.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#122437"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53e0bd"/>
      <stop offset="1" stop-color="#74aaff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#31506a" stroke-width=".8" opacity=".42"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="418" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="418" rx="18" fill="url(#background)" stroke="#3b526b" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="1000" height="420" fill="url(#grid)"/>
    <circle cx="901" cy="201" r="170" fill="#1b5262" opacity=".13"/>
    <circle cx="900" cy="199" r="115" fill="none" stroke="#54bdc1" stroke-width="1" stroke-dasharray="4 10" opacity=".25">
      <animateTransform attributeName="transform" type="rotate" from="0 900 199" to="360 900 199" dur="36s" repeatCount="indefinite"/>
    </circle>
    <path d="M760 275 L800 237 L834 250 L866 176 L903 187 L940 128 L995 148" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-dasharray="360" stroke-dashoffset="360" opacity=".75">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="3s" fill="freeze"/>
    </path>
    <g fill="#70d7cc">
      <circle cx="800" cy="237" r="4"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="866" cy="176" r="4"><animate attributeName="r" values="3;6;3" begin=".7s" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="128" r="4"><animate attributeName="r" values="3;6;3" begin="1.4s" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

