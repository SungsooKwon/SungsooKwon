<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Sungsoo Kwon — Data Scientist</title>
  <desc id="desc">Animated terminal banner with a data network and profile details.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#101f2c"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop offset="0" stop-color="#44dfb3"/>
      <stop offset="1" stop-color="#5da9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#20344a" stroke-width="1" opacity=".6"/>
    </pattern>
    <clipPath id="screen"><rect x="1" y="1" width="998" height="338" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="18" fill="url(#bg)" stroke="#30465a" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect width="1000" height="340" fill="url(#grid)" opacity=".5"/>
    <circle cx="797" cy="177" r="153" fill="#173948" opacity=".22"/>
    <circle cx="797" cy="177" r="114" fill="none" stroke="#3f9e9d" stroke-width="1" stroke-dasharray="4 8" opacity=".5"/>
    <circle cx="797" cy="177" r="73" fill="none" stroke="#3f9e9d" stroke-width="1" opacity=".35"/>
    <path d="M637 220 L690 190 L743 211 L795 145 L842 164 L890 103 L954 131" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="440" stroke-dashoffset="440">
      <animate attributeName="stroke-dashoffset" from="440" to="0" dur="2.8s" fill="freeze"/>
    </path>
    <g fill="#56d9c1">
      <circle cx="690" cy="190" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin=".6s" dur=".4s" fill="freeze"/></circle>
      <circle cx="743" cy="211" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1s" dur=".4s" fill="freeze"/></circle>
      <circle cx="795" cy="145" r="6" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur=".4s" fill="freeze"/></circle>
      <circle cx="842" cy="164" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur=".4s" fill="freeze"/></circle>
      <circle cx="890" cy="103" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur=".4s" fill="freeze"/></circle>
    </g>
    <g fill="#678aa3" font-family="Consolas, Monaco, monospace" font-size="12">
      <text x="661" y="71">DATA / SIGNAL</text>
      <text x="844" y="258">01 02 03 04 05</text>
    </g>
  </g>

  <circle cx="31" cy="27" r="6" fill="#ff6b6b"/>
  <circle cx="52" cy="27" r="6" fill="#f7c65c"/>
  <circle cx="73" cy="27" r="6" fill="#56d69c"/>
  <text x="99" y="32" fill="#7f9cb0" font-family="Consolas, Monaco, monospace" font-size="13">sungsoo@github: ~ / profile</text>
  <line x1="1" y1="48" x2="999" y2="48" stroke="#30465a"/>

  <text x="55" y="102" fill="#53d9b7" font-family="Consolas, Monaco, monospace" font-size="17">$ whoami</text>
  <text x="55" y="170" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700">Sungsoo Kwon</text>
  <text x="57" y="211" fill="#9ec0d2" font-family="Consolas, Monaco, monospace" font-size="20">Data Scientist</text>
  <rect x="56" y="245" width="226" height="38" rx="19" fill="#173c3e" stroke="#317d73"/>
  <circle cx="76" cy="264" r="5" fill="#59e0a9">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="91" y="270" fill="#b6f5df" font-family="Consolas, Monaco, monospace" font-size="15">MongooseAI · 2025—</text>
  <text x="57" y="317" fill="#7493aa" font-family="Consolas, Monaco, monospace" font-size="13">Python  /  PyTorch  /  TensorFlow  /  Hugging Face</text>
</svg>
