<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="312" viewBox="0 0 1000 312" role="img" aria-labelledby="title desc" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Arial, sans-serif">
  <title id="title">Applied AI, from data to deployment</title>
  <desc id="desc">Conceptual animated illustration of Sungsoo Kwon's end-to-end work: data analysis, AI modeling, and on-site deployment. It does not represent measured production data.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fa"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa7d7"/>
      <stop offset="1" stop-color="#5670bd"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="310" rx="28" fill="url(#surface)" stroke="#e2e6eb" stroke-width="2"/>
  <text x="46" y="48" fill="#1b2028" font-size="27" font-weight="700" letter-spacing="-.6">Industrial AI in motion</text>
  <text x="955" y="46" text-anchor="end" fill="#818994" font-size="13" font-weight="600" letter-spacing="1.2">CONCEPTUAL WORKFLOW</text>
  <text x="47" y="71" fill="#777f89" font-size="15">From understanding the data to making models useful in the field.</text>

  <rect x="46" y="90" width="288" height="178" rx="21" fill="#ffffff" stroke="#e4e8ed" stroke-width="2"/>
  <rect x="356" y="90" width="288" height="178" rx="21" fill="#ffffff" stroke="#e4e8ed" stroke-width="2"/>
  <rect x="666" y="90" width="288" height="178" rx="21" fill="#ffffff" stroke="#e4e8ed" stroke-width="2"/>
  <text x="68" y="121" fill="#89909b" font-size="13" font-weight="700" letter-spacing="1.4">01 / OBSERVE</text>
  <text x="378" y="121" fill="#89909b" font-size="13" font-weight="700" letter-spacing="1.4">02 / MODEL</text>
  <text x="688" y="121" fill="#89909b" font-size="13" font-weight="700" letter-spacing="1.4">03 / APPLY</text>
  <text x="68" y="150" fill="#222832" font-size="21" font-weight="700">Data analysis</text>
  <text x="378" y="150" fill="#222832" font-size="21" font-weight="700">AI modeling</text>
  <text x="688" y="150" fill="#222832" font-size="21" font-weight="700">On-site deployment</text>

  <line x1="68" y1="223" x2="312" y2="223" stroke="#e4e9ef" stroke-width="2"/>
  <path d="M68 206 L93 205 L112 191 L132 206 L154 207 L173 181 L194 205 L218 204 L235 193 L258 205 L280 199 L312 201" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" values="320;0;0" keyTimes="0;.7;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="173" cy="181" r="7" fill="#7095ce" opacity=".25">
    <animate attributeName="r" values="7;17;7" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0;.35" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="173" cy="181" r="5" fill="#5e82c6"/>

  <line x1="401" y1="203" x2="443" y2="181" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="401" y1="203" x2="444" y2="225" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="443" y1="181" x2="493" y2="203" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="444" y1="225" x2="493" y2="203" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="493" y1="203" x2="551" y2="185" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="493" y1="203" x2="551" y2="223" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="551" y1="185" x2="598" y2="203" stroke="#ccd9ea" stroke-width="2"/>
  <line x1="551" y1="223" x2="598" y2="203" stroke="#ccd9ea" stroke-width="2"/>
  <g fill="#8da5c9"><circle cx="401" cy="203" r="7"/><circle cx="443" cy="181" r="7"/><circle cx="444" cy="225" r="7"/><circle cx="551" cy="185" r="7"/><circle cx="551" cy="223" r="7"/><circle cx="598" cy="203" r="7"/></g>
  <circle cx="493" cy="203" r="11" fill="#6688c5">
    <animate attributeName="fill" values="#6688c5;#a284d4;#6688c5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="11;13;11" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="493" cy="203" r="5" fill="#ffffff"/>
  <circle cx="401" cy="203" r="3" fill="#ffffff">
    <animateMotion path="M0 0 L42 -22 L92 0 L150 -18 L197 0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <rect x="689" y="178" width="243" height="58" rx="14" fill="#f7f9fc" stroke="#e5ebf1"/>
  <line x1="710" y1="207" x2="908" y2="207" stroke="#c9d4e3" stroke-width="3" stroke-linecap="round"/>
  <rect x="731" y="197" width="17" height="20" rx="4" fill="#a7bddd">
    <animate attributeName="height" values="20;27;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="197;190;197" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="775" y="192" width="17" height="25" rx="4" fill="#8caad2">
    <animate attributeName="height" values="25;17;25" dur="3s" begin=".4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="192;200;192" dur="3s" begin=".4s" repeatCount="indefinite"/>
  </rect>
  <rect x="819" y="186" width="17" height="31" rx="4" fill="#7193c8">
    <animate attributeName="height" values="31;24;31" dur="3s" begin=".8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="186;193;186" dur="3s" begin=".8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="889" cy="206" r="8" fill="#55a685">
    <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <line x1="334" y1="207" x2="356" y2="207" stroke="#c8d5e5" stroke-width="2"/>
  <circle cx="338" cy="207" r="3" fill="#5f81c4"><animate attributeName="cx" values="337;353" dur="1.7s" repeatCount="indefinite"/></circle>
  <line x1="644" y1="207" x2="666" y2="207" stroke="#c8d5e5" stroke-width="2"/>
  <circle cx="648" cy="207" r="3" fill="#5f81c4"><animate attributeName="cx" values="647;663" dur="1.7s" begin=".5s" repeatCount="indefinite"/></circle>
  <text x="48" y="293" fill="#9aa2ad" font-size="12">Conceptual illustration · No production metrics shown</text>
</svg>
